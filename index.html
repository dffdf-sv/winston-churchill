<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winston Churchill</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect fill='%23FF0000' width='48' height='48'/><polygon points='18,12 18,36 32,24' fill='white'/></svg>" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #0f1535 50%, #0a0e27 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Premium vignette for depth and elegance */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.5) 80%, rgba(0, 0, 0, 0.75) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Subtle ambient background glow */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 140, 0, 0.02) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Luxury Cinematic - Soft elegant glow */
        .glow-luxury {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.12) 0%, rgba(255, 140, 0, 0.03) 40%, transparent 80%);
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.6;
        }

        /* Dark Corporate - Minimal glow accent */
        .glow-corporate {
            position: absolute;
            width: 500px;
            height: 500px;
            background: conic-gradient(from 0deg, rgba(255, 140, 0, 0.05), rgba(255, 100, 0, 0.02), rgba(255, 140, 0, 0.05));
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            opacity: 0.45;
        }

        /* Dramatic Neon - Sharp spotlight */
        .glow-neon {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.9) 0%, rgba(255, 80, 0, 0.7) 15%, rgba(255, 165, 0, 0.4) 35%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            pointer-events: none;
            opacity: 0.85;
            box-shadow: 0 0 120px rgba(255, 140, 0, 0.7), 0 0 250px rgba(255, 100, 0, 0.4);
        }

        /* Minimal Premium - Ultra subtle frame */
        .frame {
            position: relative;
            z-index: 2;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.15) 0%, rgba(255, 165, 0, 0.05) 50%, rgba(255, 140, 0, 0.1) 100%);
            border-radius: 16px;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 140, 0, 0.12);
            backdrop-filter: blur(10px);
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            width: 100%;
        }

        iframe {
            display: block;
            border-radius: 14px;
            width: 100%;
            max-width: 1400px;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
            border: none;
        }

        .frame-inner {
            padding: 2px;
            background: #0a0e27;
            border-radius: 14px;
            overflow: hidden;
        }

        /* Premium corner accents */
        .corner-accent {
            position: absolute;
            width: 2px;
            height: 30px;
            background: linear-gradient(180deg, rgba(255, 140, 0, 0.4) 0%, transparent 100%);
        }

        .corner-tl { top: 0; left: 0; }
        .corner-tr { top: 0; right: 0; }
        .corner-bl { bottom: 0; left: 0; transform: rotate(180deg); }
        .corner-br { bottom: 0; right: 0; transform: rotate(180deg); }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .glow-luxury {
                width: 500px;
                height: 500px;
            }

            .glow-corporate {
                width: 400px;
                height: 400px;
            }

            .glow-neon {
                width: 300px;
                height: 300px;
            }

            iframe {
                max-width: 1000px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .content-wrapper {
                padding: 20px;
            }

            .glow-luxury {
                width: 400px;
                height: 400px;
                filter: blur(80px);
            }

            .glow-corporate {
                width: 320px;
                height: 320px;
                filter: blur(100px);
            }

            .glow-neon {
                width: 250px;
                height: 250px;
                filter: blur(25px);
            }

            iframe {
                min-height: 280px;
                max-width: 800px;
            }
        }

        @media (max-width: 480px) {
            .content-wrapper {
                padding: 15px;
            }

            .glow-luxury {
                width: 300px;
                height: 300px;
                filter: blur(60px);
            }

            .glow-corporate {
                width: 250px;
                height: 250px;
                filter: blur(80px);
            }

            .glow-neon {
                width: 180px;
                height: 180px;
                box-shadow: 0 0 80px rgba(255, 140, 0, 0.6), 0 0 160px rgba(255, 100, 0, 0.3);
            }

            iframe {
                min-height: 200px;
                max-width: 600px;
            }

            .frame {
                padding: 1px;
            }

            .corner-accent {
                height: 20px;
            }
        }

        /* Animation for entrance */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .content-wrapper {
            animation: fadeIn 0.8s ease-out;
        }

        /* Touch indicator for multitouch */
        .touch-point {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 140, 0, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            animation: touchPulse 0.6s ease-out forwards;
        }

        @keyframes touchPulse {
            0% {
                width: 40px;
                height: 40px;
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.6);
            }
            100% {
                width: 100px;
                height: 100px;
                opacity: 0;
                box-shadow: 0 0 0 20px rgba(255, 140, 0, 0);
            }
        }
    </style>
</head>
<body>
    <div class="glow-container">
        <div class="glow-luxury" id="glowLuxury"></div>
        <div class="glow-corporate" id="glowCorporate"></div>
        <div class="glow-neon" id="glowNeon"></div>
    </div>
    
    <div class="content-wrapper">
        <div class="frame">
            <div class="corner-accent corner-tl"></div>
            <div class="corner-accent corner-tr"></div>
            <div class="corner-accent corner-bl"></div>
            <div class="corner-accent corner-br"></div>
            
            <div class="frame-inner">
                <iframe 
                    width="1400" 
                    height="788" 
                    src="https://www.youtube-nocookie.com/embed/PkQ8uFiqx4k?si=z4WurYjUG85A2RdA" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const glowNeon = document.getElementById('glowNeon');
        const glowCorporate = document.getElementById('glowCorporate');
        const glowLuxury = document.getElementById('glowLuxury');
        
        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;
        let currentXSlow = targetX;
        let currentYSlow = targetY;
        let currentXMedium = targetX;
        let currentYMedium = targetY;

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        // Multitouch support
        document.addEventListener('touchmove', (e) => {
            const touches = e.touches;
            if (touches.length > 0) {
                const primaryTouch = touches[0];
                targetX = primaryTouch.clientX;
                targetY = primaryTouch.clientY;

                // Create visual indicators for all touch points
                for (let i = 0; i < touches.length; i++) {
                    createTouchIndicator(touches[i].clientX, touches[i].clientY);
                }
            }
        }, false);

        function createTouchIndicator(x, y) {
            const touchPoint = document.createElement('div');
            touchPoint.className = 'touch-point';
            touchPoint.style.left = (x - 20) + 'px';
            touchPoint.style.top = (y - 20) + 'px';
            document.body.appendChild(touchPoint);

            setTimeout(() => {
                touchPoint.remove();
            }, 600);
        }

        function animate() {
            // Luxury Cinematic - slowest (elegant, sweeping motion)
            currentXSlow += (targetX - currentXSlow) * 0.03;
            currentYSlow += (targetY - currentYSlow) * 0.03;
            glowLuxury.style.left = (currentXSlow - 300) + 'px';
            glowLuxury.style.top = (currentYSlow - 300) + 'px';

            // Dark Corporate - medium speed (subtle accent)
            currentXMedium += (targetX - currentXMedium) * 0.05;
            currentYMedium += (targetY - currentYMedium) * 0.05;
            glowCorporate.style.left = (currentXMedium - 250) + 'px';
            glowCorporate.style.top = (currentYMedium - 250) + 'px';

            // Dramatic Neon - instant response (sharp spotlight)
            glowNeon.style.left = (targetX - 175) + 'px';
            glowNeon.style.top = (targetY - 175) + 'px';

            requestAnimationFrame(animate);
        }

        animate();

        // Handle window resize for responsive mobile
        window.addEventListener('resize', () => {
            targetX = window.innerWidth / 2;
            targetY = window.innerHeight / 2;
            currentXSlow = targetX;
            currentYSlow = targetY;
            currentXMedium = targetX;
            currentYMedium = targetY;
        });
    </script>
</body>
</html>
