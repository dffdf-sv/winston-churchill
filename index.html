<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winston Churchill</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23FF0000'/%3E%3Cpolygon points='18,12 18,36 32,24' fill='white'/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0e27 0%, #0f1535 50%, #0a0e27 100%);
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 3;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,140,0,0.03), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(90px);
      opacity: 0.7;
      z-index: 1;
    }

    .glow.luxury {
      background: radial-gradient(circle, rgba(255,170,70,0.18) 0%, rgba(255,140,0,0.08) 38%, transparent 78%);
    }

    .glow.corporate {
      background: conic-gradient(from 0deg, rgba(255,140,0,0.08), rgba(255,100,0,0.03), rgba(255,140,0,0.08));
      filter: blur(120px);
      opacity: 0.45;
    }

    .glow.neon {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255,140,0,0.9) 0%, rgba(255,80,0,0.7) 18%, rgba(255,165,0,0.35) 38%, transparent 72%);
      filter: blur(32px);
      box-shadow: 0 0 120px rgba(255,140,0,0.7), 0 0 200px rgba(255,100,0,0.35);
      opacity: 0.8;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(92vw, 1400px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      animation: fadeIn 0.8s ease-out;
    }

    .frame {
      position: relative;
      background: linear-gradient(135deg, rgba(255,140,0,0.14), rgba(255,165,0,0.04), rgba(255,140,0,0.1));
      border-radius: 16px;
      padding: 2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 28px 80px rgba(0,0,0,0.7), 0 0 38px rgba(255,140,0,0.12);
      backdrop-filter: blur(10px);
    }

    .frame-inner {
      border-radius: 14px;
      background: #0a0e27;
      padding: 2px;
      overflow: hidden;
    }

    .corner {
      position: absolute;
      width: 2px;
      height: 24px;
      background: linear-gradient(180deg, rgba(255,140,0,0.5), transparent);
    }

    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; }
    .corner.bl { bottom: 0; left: 0; transform: rotate(180deg); }
    .corner.br { bottom: 0; right: 0; transform: rotate(180deg); }

    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-width: 1400px;
      min-height: 700px;
      border: 0;
      border-radius: 14px;
      background: #000;
    }

    @media (max-width: 900px) {
      .content { width: min(96vw, 1100px); padding: 18px; }
      iframe { min-height: 500px; }
    }

    @media (max-width: 600px) {
      .content { padding: 12px; }
      iframe { min-height: 280px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow luxury" id="glowLuxury"></div>
  <div class="glow corporate" id="glowCorporate"></div>
  <div class="glow neon" id="glowNeon"></div>

  <div class="content">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="frame-inner">
        <iframe
          src="https://www.youtube-nocookie.com/embed/PkQ8uFiqx4k?si=z4WurYjUG85A2RdA"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const glowLuxury = document.getElementById('glowLuxury');
    const glowCorporate = document.getElementById('glowCorporate');
    const glowNeon = document.getElementById('glowNeon');

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentXSlow = targetX;
    let currentYSlow = targetY;
    let currentXMedium = targetX;
    let currentYMedium = targetY;

    document.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });

    function animate() {
      currentXSlow += (targetX - currentXSlow) * 0.03;
      currentYSlow += (targetY - currentYSlow) * 0.03;
      glowLuxury.style.left = (currentXSlow - 350) + 'px';
      glowLuxury.style.top = (currentYSlow - 350) + 'px';

      currentXMedium += (targetX - currentXMedium) * 0.06;
      currentYMedium += (targetY - currentYMedium) * 0.06;
      glowCorporate.style.left = (currentXMedium - 250) + 'px';
      glowCorporate.style.top = (currentYMedium - 250) + 'px';

      glowNeon.style.left = (targetX - 190) + 'px';
      glowNeon.style.top = (targetY - 190) + 'px';

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
