<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winston Churchill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.6) 0%, rgba(255, 165, 0, 0.3) 30%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            display: block;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="glow-container">
        <div class="glow" id="glow"></div>
    </div>
    
    <div class="content-wrapper">
        <iframe 
            width="1200" 
            height="630" 
            src="https://www.youtube-nocookie.com/embed/PkQ8uFiqx4k?si=z4WurYjUG85A2RdA" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const glow = document.getElementById('glow');
        
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX - 150; // Center the glow (300px / 2)
            const y = e.clientY - 150;
            
            glow.style.left = x + 'px';
            glow.style.top = y + 'px';
        });
    </script>
</body>
</html>
